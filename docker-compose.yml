services:
  primary:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: harsh
      POSTGRES_DB: shop
    ports:
      - "5434:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  replica:
    image: postgres:16
    environment:
      PGPASSWORD: harsh_replicator
    ports:
      - "5433:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./replica-entrypoint.sh:/replica-entrypoint.sh
    entrypoint: [ "bash", "/replica-entrypoint.sh" ]
    depends_on:
      - primary

volumes:
  primary_data:
  replica_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.25.0.0/16
